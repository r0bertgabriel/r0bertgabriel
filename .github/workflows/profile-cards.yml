name: Generate profile cards

# Gera os SVGs estáticos usados no README (estatísticas, linguagens e troféus)
# e faz commit deles em profile/. Assim o perfil não depende de instâncias
# públicas que ficam fora do ar por excesso de tráfego.
#
# Token: usa o secret METRICS_TOKEN se existir (um Personal Access Token
# permite contar também os repositórios privados); caso contrário, usa o
# token padrão do workflow, que já funciona para os dados públicos.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Stats card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          user: ${{ github.repository_owner }}
          filename: profile/stats.svg
          base: header, activity, community, repositories
          config_timezone: America/Belem
          committer_token: ${{ github.token }}
          committer_message: "chore: update profile stats card"

      - name: Top languages card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          user: ${{ github.repository_owner }}
          filename: profile/top-langs.svg
          base: ""
          plugin_languages: yes
          plugin_languages_limit: 8
          config_timezone: America/Belem
          committer_token: ${{ github.token }}
          committer_message: "chore: update top languages card"

      - name: Trophies card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          user: ${{ github.repository_owner }}
          filename: profile/trophy.svg
          base: ""
          plugin_achievements: yes
          plugin_achievements_display: compact
          config_timezone: America/Belem
          committer_token: ${{ github.token }}
          committer_message: "chore: update trophies card"
